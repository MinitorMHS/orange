name = "meet"
# https://developers.cloudflare.com/workers/platform/compatibility-dates
compatibility_date = "2024-10-07"
main = "./build/index.js"
compatibility_flags = ["nodejs_compat"]

[site]
  bucket = "./public"

[vars]
CALLS_APP_ID = "88d55cfc603cac89c8d588b767ca476f"
TURN_SERVICE_ID = "ac69f8829674e02746fea4b7058a0ff4"
# End-to-end encryption of media between participants (MLS; assets in public/e2ee)
E2EE_ENABLED = "true"
# Simulcast webcam layers (useful for multi-party video on weak networks).
# Uncomment to enable; audio-only calls don't need it.
EXPERIMENTAL_SIMULCAST_ENABLED = "true"
# Optional webhook (e.g. Google Chat) that bug reports get forwarded to.
# Bug-report button + dead-track API only activate when this is set.
FEEDBACK_URL = "https://t.me/minitor"

# Workers Logs: console.log + uncaught exceptions visible in dashboard / wrangler tail
[observability]
enabled = true

# Call-quality feedback ("Experience any issues?" page after a call) -> D1
[[kv_namespaces]]
binding = "FEEDBACK_STORAGE"
id = "60e53cbaa9e94327b57303be75f60ec1" # npx wrangler kv:namespace create FEEDBACK_STORAGE

[[queues.producers]]
queue = "meet-feedback"
binding = "FEEDBACK_QUEUE"

[[queues.consumers]]
queue = "meet-feedback"
max_batch_size = 10
max_batch_timeout = 5

# Meetings + feedback analytics tables (schema.ts); applied via wrangler d1 execute
[[d1_databases]]
binding = "DB"
database_name = "meet-db"
database_id = "4d11613c-1ab4-4d97-9737-faddebfb0add" # npx wrangler d1 create meet-db

[[durable_objects.bindings]]
name = "rooms"
class_name = "ChatRoom"

# Indicate that you want the ChatRoom class to be callable as Durable Objects.
[[migrations]]
tag = "v1" # Should be unique for each entry
new_sqlite_classes = ["ChatRoom"]

# The necessary secrets are:
# - CALLS_APP_SECRET
# To add secret, run `echo <VALUE> | wrangler secret put <NAME>`

# Optional secrets:
# OPENAI_API_TOKEN = ""
